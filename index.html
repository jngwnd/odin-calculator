<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Calculator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/index.css">
    <script type="module" src="js/index.js"></script>
</head>
<body>
    <div id="calc-container">
        <div id="display">0</div>
        <div id="buttons">
            <button id="delete"
                    class="icon"
                    data-value="delete"></button>
            <button id="clear"
                    class="icon"
                    data-value="clear">AC</button>
            <button id="modulo"
                    class="icon"
                    data-value="%"></button>
            <button id="divide"
                    class="icon orange"
                    data-value="/"></button>
            <button class="number"
                    data-value="7">7</button>
            <button class="number"
                    data-value="8">8</button>
            <button class="number"
                    data-value="9">9</button>
            <button id="multiply"
                    class="icon orange"
                    data-value="*"></button>
            <button class="number"
                    data-value="4">4</button>
            <button class="number"
                    data-value="5">5</button>
            <button class="number"
                    data-value="6">6</button>
            <button id="subtract"
                    class="icon orange"
                    data-value="-"></button>
            <button class="number"
                    data-value="1">1</button>
            <button class="number"
                    data-value="2">2</button>
            <button class="number"
                    data-value="3">3</button>
            <button id="add"
                    class="icon orange"
                    data-value="+"></button>
            <button id="sign"
                    class="number icon"
                    data-value="sign"></button>
            <button class="number"
                    data-value="0">0</button>
            <button class="number"
                    data-value=".">.</button>
            <button id="equal"
                    class="icon orange"
                    data-value="="></button>
        </div>
    </div>    
</body>
</html>
