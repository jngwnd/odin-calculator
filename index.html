<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Calculator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/index.css">
    <script type="module" src="js/index.js"></script>
</head>
<body>
    <div id="calc-container">
        <div id="display">0</div>
        <div id="buttons">
            <button id="delete" class="icon"></button>
            <button id="clear" class="icon">AC</button>
            <button id="modulo" class="icon"></button>
            <button id="divide" class="operator icon"></button>
            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button id="multiply" class="operator icon"></button>
            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button id="subtract" class="operator icon"></button>
            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button id="add" class="operator icon"></button>
            <button id="sign" class="icon"></button>
            <button class="number">0</button>
            <button id="decimal">.</button>
            <button id="equal" class="operator icon"></button>
        </div>
    </div>    
</body>
</html>
